
# Midnight Forest — Fuzzel
# Managed by GNU Stow

dpi-aware=no
icon-theme=Papirus-Dark

# Layout
width=35
lines=12
font=JetBrainsMono Nerd Font:size=12
line-height=28

# Search
fields=name,generic,comment,categories,filename,keywords
terminal=foot -e
prompt="❯ "
placeholder="Search..."
show-actions=yes
exit-on-keyboard-focus-loss=no
anchor=center

[colors]
# Midnight Forest
background=111820f2
text=dce5edff
match=81a9cfff

selection=202d39ff
selection-match=81a9cfff
selection-text=dce5edff

border=344555ff
prompt=81a9cfff
input=dce5edff
counter=8797a7ff

[border]
width=1
radius=12

[dmenu]
exit-immediately-if-empty=no
