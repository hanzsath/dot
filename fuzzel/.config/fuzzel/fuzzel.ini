
# Ultra-Minimal Fuzzel
# Black & White — Managed by GNU Stow

dpi-aware=no
icon-theme=Papirus-Dark

# Layout
width=32
lines=9
font=JetBrainsMono Nerd Font:size=11
line-height=26
horizontal-pad=12
vertical-pad=8
inner-pad=6

# Search
fields=name,generic,comment,categories,filename,keywords
terminal=foot -e
prompt="❯ "
placeholder="Search..."
show-actions=yes
exit-on-keyboard-focus-loss=no
anchor=center

[colors]
background=000000f5
text=ffffffff
match=ffffffff

selection=222222ff
selection-text=ffffffff
selection-match=ffffffff

border=555555ff
prompt=ffffffff
input=ffffffff
counter=888888ff

[border]
width=1
radius=0

[dmenu]
exit-immediately-if-empty=no

