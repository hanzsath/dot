
# Fuzzel — Pure Black

[main]
dpi-aware=no
icon-theme=Papirus-Dark
width=32
lines=9
font=JetBrainsMono Nerd Font:size=11
line-height=26
horizontal-pad=12
vertical-pad=8
inner-pad=6
fields=name,generic,comment,categories,filename,keywords
terminal=foot -e
prompt="❯ "
placeholder="Search..."
show-actions=yes
exit-on-keyboard-focus-loss=no
anchor=center

[colors]
background=000000f5
text=e8e8e8ff
match=ffffffff
selection=1c1c1cff
selection-text=ffffffff
selection-match=ffffffff
border=404040ff
prompt=ffffffff
input=e8e8e8ff
counter=888888ff

[border]
width=1
radius=8

[dmenu]
exit-immediately-if-empty=no

