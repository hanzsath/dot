
# Ultra-Minimal Foot
# Black / White / Status Colors

[main]
font=JetBrainsMono Nerd Font Mono:size=13
term=xterm-256color
initial-color-theme=dark
pad=10x8
selection-target=clipboard

[scrollback]
lines=10000

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=1.0

# Main appearance
background=000000
foreground=eeeeee

# Cursor
cursor=000000 ffffff

# Selection
selection-foreground=000000
selection-background=aaaaaa

# Normal colors
regular0=111111
regular1=ff5555
regular2=50fa7b
regular3=dddddd
regular4=aaaaaa
regular5=cccccc
regular6=bbbbbb
regular7=eeeeee

# Bright colors
bright0=777777
bright1=ff7777
bright2=80ff9f
bright3=ffffff
bright4=dddddd
bright5=eeeeee
bright6=dddddd
bright7=ffffff

# URLs
urls=bbbbbb

[colors-light]
alpha=1.0
background=ffffff
foreground=111111

cursor=ffffff 000000

selection-foreground=ffffff
selection-background=444444

regular0=111111
regular1=bb2222
regular2=228844
regular3=555555
regular4=555555
regular5=666666
regular6=555555
regular7=eeeeee

bright0=777777
bright1=dd3333
bright2=33aa55
bright3=333333
bright4=777777
bright5=888888
bright6=777777
bright7=ffffff

urls=555555

