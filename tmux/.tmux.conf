
# ============================================
# TMUX — Ultra-Minimal Black & White
# Development · VPS · SSH
# ============================================

# --------------------------------------------
# Terminal
# --------------------------------------------

set -g default-terminal "tmux-256color"
set -g focus-events on
set -sg escape-time 10

set -g history-limit 50000
set -g mouse on

# Window and pane numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep manual window names
set -g automatic-rename off

# --------------------------------------------
# Session behavior
# --------------------------------------------

set -g detach-on-destroy on

setw -g mode-keys vi

set -g monitor-activity on
set -g visual-activity off
set -g bell-action none

# --------------------------------------------
# Status bar
# --------------------------------------------

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left

set -g status-style "bg=#000000,fg=#ffffff"

# Session name
set -g status-left-length 30
set -g status-left \
"#[fg=#ffffff,bold] #S #[fg=#555555]│ "

# Hostname and time
set -g status-right-length 90
set -g status-right \
"#[fg=#ffffff]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#888888]#h #[fg=#555555]│ #[fg=#ffffff]%H:%M #[fg=#888888]%d %b "

# --------------------------------------------
# Window tabs
# --------------------------------------------

set -g window-status-separator ""

# Inactive windows
set -g window-status-format \
"#[fg=#777777,bg=#000000] #I:#W#{?window_activity_flag,*,} "

# Active window — white underline
set -g window-status-current-format \
"#[fg=#ffffff,bg=#000000,bold,underscore] #I:#W #[default]"

# Activity
set -g window-status-activity-style "fg=#ffffff"

# --------------------------------------------
# Pane borders
# --------------------------------------------

set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#ffffff"

set -g pane-border-status off

# --------------------------------------------
# Messages and copy mode
# --------------------------------------------

set -g message-style "bg=#111111,fg=#ffffff"
set -g message-command-style "bg=#111111,fg=#ffffff"

set -g mode-style "bg=#333333,fg=#ffffff"

setw -g clock-mode-colour "#ffffff"

# --------------------------------------------
# Keybindings
# --------------------------------------------

# Prefix: Ctrl+b

# Split panes in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Vim pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload configuration
bind r source-file ~/.tmux.conf \; \
display-message "tmux config reloaded"

# Session picker
bind S choose-tree -s

# Toggle pane zoom
bind z resize-pane -Z

# Copy mode
bind [ copy-mode

# Vim-style selection
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --------------------------------------------
# Window appearance
# --------------------------------------------

set -g window-style "bg=#000000"
set -g window-active-style "bg=#000000"

# ============================================
# END
# ============================================

