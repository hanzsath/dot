
# =========================================================
# MIDNIGHT FOREST v2
# Nordic Blue · Minimal · VPS & Development
# =========================================================

# ---------------------------------------------------------
# 1. TERMINAL
# ---------------------------------------------------------

set -g default-terminal "tmux-256color"
set -g focus-events on
set -sg escape-time 10

# Larger scrollback
set -g history-limit 50000

# Mouse support
set -g mouse on

# Window and pane numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prevent automatic window renaming
set -g automatic-rename off

# ---------------------------------------------------------
# 2. SESSION BEHAVIOR
# ---------------------------------------------------------

# Keep sessions alive when detached
set -g detach-on-destroy on

# Vi-style copy mode
setw -g mode-keys vi

# Enable activity monitoring without audible bells
set -g monitor-activity on
set -g visual-activity off
set -g bell-action none

# ---------------------------------------------------------
# 3. THEME COLORS
# ---------------------------------------------------------

# Background:        #111820
# Surface:           #19232D
# Border:            #344555
# Nordic Blue:       #81A9CF
# Blue Highlight:    #527FA8
# Foreground:        #DCE5ED
# Muted Text:        #8797A7
# Gold Accent:       #D7AE72

# ---------------------------------------------------------
# 4. STATUS BAR
# ---------------------------------------------------------

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left

set -g status-style "bg=#111820,fg=#DCE5ED"

# Session name
set -g status-left-length 35
set -g status-left \
"#[fg=#111820,bg=#81A9CF,bold] ❯ #S #[fg=#81A9CF,bg=#111820] "

# Right indicators
set -g status-right-length 90
set -g status-right \
"#[fg=#D7AE72,bold]#{?pane_in_mode, COPY ,}#{?client_prefix, PREFIX ,}#{?window_zoomed_flag, ZOOM ,}#[fg=#8797A7] #h #[fg=#344555]│#[fg=#81A9CF,bold] %H:%M #[fg=#8797A7]%d %b "

# ---------------------------------------------------------
# 5. WINDOW TABS
# ---------------------------------------------------------

set -g window-status-separator ""

# Inactive windows
set -g window-status-format \
"#[fg=#8797A7,bg=#111820] #I:#W#{?window_activity_flag,*,} "

# Active window
set -g window-status-current-format \
"#[fg=#111820,bg=#81A9CF,bold] #I:#W #[default]"

# Activity highlights
set -g window-status-activity-style "fg=#D7AE72"

# ---------------------------------------------------------
# 6. PANE BORDERS
# ---------------------------------------------------------

set -g pane-border-style "fg=#344555"
set -g pane-active-border-style "fg=#81A9CF"

set -g pane-border-status off

# ---------------------------------------------------------
# 7. MESSAGES & COPY MODE
# ---------------------------------------------------------

set -g message-style "bg=#19232D,fg=#81A9CF"
set -g message-command-style "bg=#19232D,fg=#81A9CF"

set -g mode-style "bg=#527FA8,fg=#111820"

setw -g clock-mode-colour "#81A9CF"

# ---------------------------------------------------------
# 8. KEYBINDINGS
# ---------------------------------------------------------

# Keep default Ctrl+b prefix

# Split panes, preserving current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Create window in current directory
bind c new-window -c "#{pane_current_path}"

# Navigate panes with prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload configuration
bind r source-file ~/.tmux.conf \; \
display-message "Midnight Forest reloaded"

# Session picker
bind S choose-tree -s

# Toggle pane zoom
bind z resize-pane -Z

# Copy mode with prefix + [
bind [ copy-mode

# Vim-style selection in copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---------------------------------------------------------
# 9. NEW WINDOW STYLE
# ---------------------------------------------------------

set -g window-style "bg=#111820"
set -g window-active-style "bg=#111820"

# ---------------------------------------------------------
# END — MIDNIGHT FOREST v2
# =========================================================

