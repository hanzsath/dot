
# Catppuccin Mocha — Fuzzel
# Managed by GNU Stow

dpi-aware=no
icon-theme=Papirus-Dark

# Layout
width=35
lines=12
font=JetBrainsMono Nerd Font:size=12
line-height=28

# Search
fields=name,generic,comment,categories,filename,keywords
terminal=foot -e
prompt="❯ "
placeholder="Search..."
show-actions=yes
exit-on-keyboard-focus-loss=no
anchor=center

[colors]
# Catppuccin Mocha
background=1e1e2ef2
text=cdd6f4ff
match=cba6f7ff

selection=313244ff
selection-match=b4befeff
selection-text=cdd6f4ff

border=585b70ff
prompt=b4befeff
input=cdd6f4ff
counter=a6adc8ff

[border]
width=1
radius=12

[dmenu]
exit-immediately-if-empty=no
