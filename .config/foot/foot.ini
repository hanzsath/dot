# -*- conf -*-

font=JetBrainsMono Nerd Font Mono:size=12
pad=16x16
initial-color-theme=dark

[cursor]
style=block

[colors-dark]
alpha=0.95
background=1a1b26
foreground=a9b1d6
flash=e0af68
flash-alpha=0.5

cursor=1a1b26 7aa2f7

# Normal colors (0-7) — slightly richer base
regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=c0caf5

# Bright colors (8-15) — MUCH more vibrant for ls -la
bright0=565f89
bright1=ff9e64
bright2=c3e88d
bright3=ffc777
bright4=82aaff
bright5=fca7ea
bright6=86e1fc
bright7=ffffff

# Selection
selection-foreground=1a1b26
selection-background=a9b1d6

# Search box
search-box-no-match=1a1b26 f7768e
search-box-match=1a1b26 e0af68

# URLs
urls=e0af68

# Scrollback indicator
scrollback-indicator=15161e 7aa2f7

