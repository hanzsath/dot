# ============================================
# Tmux — Default Keys, Nice Colors
# ============================================

# Basics (no key changes)
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 10000

# Terminal colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --------------------------------------------
# Tokyo Night Colors (no keybinds changed)
# --------------------------------------------

# Status bar
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left " [#S] "
set -g status-right " %H:%M "
set -g status-left-length 20
set -g status-right-length 20

# Windows
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W* "
setw -g window-status-current-style "bg=#7aa2f7,fg=#1a1b26,bold"

# Pane borders
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Messages
set -g message-style "bg=#24283b,fg=#a9b1d6"

# Copy mode highlight
setw -g mode-style "bg=#7aa2f7,fg=#1a1b26"
